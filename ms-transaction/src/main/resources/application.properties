spring.application.name=ms-transaction
spring.profile.active=dev
server.port=8080

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true

spring.r2dbc.url=r2dbc:postgresql://postgres:5432/postgres
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# application.properties
debug.kafka=true
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.template.default-topic=transactionTopic
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=event:com.interbank.pe.ms_transaction.models.event.TransactionEvent

logging.level.org.springframework.kafka=DEBUG
logging.level.org.springframework.core.env=TRACE
