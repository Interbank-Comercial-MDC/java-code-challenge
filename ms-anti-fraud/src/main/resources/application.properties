spring.application.name=ms-anti-fraud
spring.profile.active=dev
server.port=8080

transaction.max-value=1000.00

services.transaction.baseUrl=http://ms-transaction:8080/api/transactions

# application.properties
debug.kafka=true
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.template.default-topic=transactionTopic
spring.kafka.consumer.group-id=transactionId
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.interbank.pe.ms_anti_fraud.models.event.TransactionEvent

logging.level.org.springframework.kafka=DEBUG
logging.level.org.springframework.core.env=TRACE